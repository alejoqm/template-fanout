server.port=8081
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# ==================== Kafka Configuration ====================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=engagement-update-processor-us
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Topic names (using standard Spring Boot property prefix)
spring.kafka.template.default-topic=template-publishes
# Custom alias for the listener if needed (optional)
# kafka.topic.template-publish is deprecated; using spring.kafka.template.default-topic instead

# ==================== Database (PostgreSQL) ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/fanout_processor
spring.datasource.username=fanout_user
#for non-local environments this should be gotten from AWS Secret.
spring.datasource.password=changeme
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==================== Processor Tuning ====================
# Max concurrent engagement loads per pod
processor.max-concurrency=100

# Batch size for claim loops
processor.batch-size=1000

# Max retry attempts before dead-letter
processor.max-retries=3

# Timeout for single engagement load (slightly above 60s baseline)
processor.load-timeout-seconds=90

# Reconciliation schedule (cron)
processor.reconciliation-cron=0 0 2 * * ?

# ==================== Resilience4j (Rate Limiting & Circuit Breaking) ====================
resilience4j.ratelimiter.instances.engagement-loader.limit-for-period=100
resilience4j.ratelimiter.instances.engagement-loader.limit-refresh-period=1s
resilience4j.ratelimiter.instances.engagement-loader.timeout-duration=0ms

resilience4j.circuitbreaker.instances.downstream-loader.sliding-window-type=count_based
resilience4j.circuitbreaker.instances.downstream-loader.sliding-window-size=20
resilience4j.circuitbreaker.instances.downstream-loader.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.downstream-loader.wait-duration-in-open-state=30s

# ==================== Logging ====================
logging.level.root=INFO
logging.level.com.templatefanout=DEBUG
logging.level.org.springframework.kafka=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=./logs/engagement-processor.log


processor.simulation-mode=true

# Simulated load time (default 60 seconds = real engagement load time)
processor.simulated-load-seconds=60

